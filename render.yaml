# Render Blueprint — Free Tier Deployment
# Deploy via: Render Dashboard → New → Blueprint → Connect GitHub repo
# Uses H2 in-memory database (no paid PostgreSQL needed)

services:
  - type: web
    name: reconix-server
    runtime: docker
    repo: https://github.com/Bhuvan-1005/Reconix
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
